[data-club="os"]{--club:var(--wine-hi);--club-soft:rgba(168,68,58,.22);--club-ink:#F6ECE2}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font:500 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--ink);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (max-width:519px){html,body{background:var(--ink)}}
body{overscroll-behavior:none}
.install{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left}
.install .ic{color:var(--club)}
.steps-i{display:flex;flex-direction:column;gap:14px;counter-reset:st;margin-top:8px}
.steps-i li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-weight:600}
.steps-i li::before{counter-increment:st;content:counter(st);flex:none;width:28px;height:28px;border-radius:50%;background:var(--club);color:var(--club-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:96px;scrollbar-width:none}
.view::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.g{padding-left:var(--gl);padding-right:var(--gr)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;flex:none;display:block}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:700}
p{margin:0}
.h1{font-size:25px;line-height:1.12}
.h2{font-size:16px;line-height:1.25;font-weight:600}
.h3{font-size:19px;line-height:1.2}
.mute{color:var(--mute)}
.dim{color:var(--dim)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.accent{color:var(--club)}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{color:var(--mute);font-size:13px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* logos as masks so they take any brand color */
.mark{display:block;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.mark-kp{--m:var(--logo-kp);aspect-ratio:680/159;height:28px}
.mark-os{--m:var(--logo-os);aspect-ratio:300/66;height:24px;color:var(--sand)}

/* header */
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding-block:12px;background:var(--ink)}
.hd .brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--fg)}
.clubchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 9px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:700;max-width:58%}
.clubchip .ic{width:16px;height:16px}
.clubchip .ic:first-child{color:var(--club)}
.clubchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--magenta);box-shadow:0 0 0 2px var(--s2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;background:var(--blue);color:var(--on-accent);font-weight:800;font-size:15px;letter-spacing:.01em;transition:transform .12s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--blue-hi)}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 16px;font-size:13.5px}
.btn.ghost{background:var(--s2);color:var(--fg)}
.btn.ghost:hover{background:var(--s3)}
.btn.line{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--s3)}
.btn.club{background:var(--club);color:var(--club-ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px rgba(255,77,94,.35)}
.btn[disabled]{background:var(--s2);color:var(--dim);transform:none}

/* hero slider */
.hero{position:relative;margin-top:4px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;padding-inline:var(--gl) var(--gr);scroll-padding-inline:var(--gl)}
.slides::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:start;min-height:228px;border-radius:24px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;isolation:isolate}
.slide .big{position:absolute;right:-6px;top:-14px;font-family:var(--f-display);font-weight:800;font-size:92px;line-height:1;letter-spacing:-.04em;z-index:-1;white-space:nowrap}
.slide .ring{position:absolute;border-radius:50%;z-index:-1}
.slide h3{font-size:22px;line-height:1.12;max-width:15ch}
.slide p{font-size:14px;max-width:30ch;opacity:.86}
.slide .btn{align-self:flex-start;margin-top:6px;height:42px;font-size:14px}
.t-blue{background:var(--blue);color:#fff}
.t-blue .big{color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.4)}
.t-blue .btn{background:#fff;color:var(--blue)}
.t-magenta{background:var(--magenta);color:#fff}
.t-magenta .big{color:rgba(255,255,255,.18)}
.t-magenta .btn{background:var(--ink);color:#fff}
.t-wine{background:var(--wine);color:#F6ECE2}
.t-wine .big{color:transparent;-webkit-text-stroke:1.5px rgba(199,188,177,.45)}
.t-wine .btn{background:var(--sand);color:#2A1F1A}
.t-ink{background:var(--s2);color:var(--fg)}
.t-ink .big{color:transparent;-webkit-text-stroke:1.5px rgba(47,91,255,.6)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--s3);transition:width .2s,background .2s}
.dots i.on{width:18px;background:var(--fg)}

/* gift banner */
.giftbar{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--magenta);color:#fff}
.giftbar b{display:block;font-size:14.5px}
.giftbar small{font-size:12.5px;opacity:.9}
.giftbar .x{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.18)}

/* quick tiles */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-inline:var(--gl) var(--gr);scroll-padding-inline:var(--gl);scroll-snap-type:x proximity}
.tile{flex:0 0 104px;height:104px;border-radius:20px;background:var(--s1);padding:12px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;border:1px solid var(--line);transition:background .15s}
.tile:hover{background:var(--s2)}
.tile .ic{width:26px;height:26px;color:var(--club)}
.tile b{font-size:13.5px;line-height:1.15;font-weight:700}
.tile.primary{background:var(--club);border-color:transparent;color:var(--club-ink)}
.tile.primary .ic{color:var(--club-ink)}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px}
.bk{display:flex;gap:12px;align-items:center}
.bk .when{flex:none;width:58px;text-align:center;padding:8px 0;border-radius:14px;background:var(--club-soft)}
.bk .when b{display:block;font-family:var(--f-display);font-size:15px}
.bk .when small{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* club load */
.load{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%}
.load-top{display:flex;gap:12px;align-items:flex-start}
.load-top .grow b{display:block;font-size:15px}
.load-num{text-align:right}
.load-num b{font-family:var(--f-display);font-size:26px;line-height:1}
.load-num small{display:block;font-size:11.5px;color:var(--mute)}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;gap:3px;height:46px}
.bars i{display:block;border-radius:3px 3px 1px 1px;background:var(--s3);min-height:3px}
.bars i.now{background:var(--club)}
.bars i.past{background:var(--s2)}
.bars-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:-8px}
.load-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:rgba(61,203,130,.14);color:var(--ok)}
.pill.warn{background:rgba(255,181,71,.14);color:var(--warn)}
.pill.bad{background:rgba(255,77,94,.14);color:var(--bad)}
.pill.info{background:var(--club-soft);color:var(--fg)}
.pill.info::before{background:var(--club)}
.pill.plain::before{display:none}
.avs{display:flex}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none;box-shadow:0 0 0 2px var(--s1)}
.avs .av+.av{margin-left:-9px}
.avs .more{background:var(--s3);color:var(--fg);font-size:11px}

/* promos */
.promo{flex:0 0 220px;min-height:150px;border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;scroll-snap-align:start;text-align:left;position:relative;overflow:hidden;isolation:isolate}
.promo b{font-family:var(--f-display);font-size:16px;line-height:1.15;font-weight:700}
.promo small{font-size:12.5px;opacity:.85}
.promo .ic{width:28px;height:28px}

/* contacts */
.contact-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.contact-row:last-child{border-bottom:0}
.contact-row .ic{color:var(--mute)}

/* tab bar + strip + fab */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--line);padding-top:6px;padding-bottom:8px;padding-left:var(--gl);padding-right:var(--gr);position:relative;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;color:var(--dim);font-size:10.5px;font-weight:700;text-align:center}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--fg)}
.tab.on .ic{color:var(--club)}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;font-size:12.5px;font-weight:700;position:relative;z-index:6}
.strip.bad{background:var(--bad);color:#fff}
.strip.warn{background:var(--magenta);color:#fff}
.strip.info{background:var(--s2);color:var(--fg)}
.strip button{text-decoration:underline;text-underline-offset:3px;flex:none}
.fab{position:absolute;right:var(--gr);bottom:var(--fab-b,96px);z-index:7;width:56px;height:56px;border-radius:50%;background:var(--magenta);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(242,11,158,.35)}
.fab .ic{width:26px;height:26px}

/* challenges */
.ch-hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px;padding-top:20px;padding-bottom:26px;background:var(--blue);color:#fff;isolation:isolate}
.ch-hero .ring{position:absolute;border-radius:50%;z-index:-1}
.ch-hero h1{font-size:30px;line-height:1.05;max-width:11ch;margin-top:26px}
.ch-hero p{margin-top:10px;max-width:32ch;opacity:.9}
.pts{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.25);font-weight:800;font-size:13.5px}
.ch{display:flex;flex-direction:column;gap:12px}
.ch-top{display:flex;gap:14px;align-items:flex-start}
.ch-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.ch-ico .ic{width:28px;height:28px}
.progress{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:var(--club)}
.reward{font-size:12.5px;font-weight:800;color:var(--magenta)}

/* schedule */
.sched-hd{padding-top:16px;padding-bottom:4px}
.title-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.1;text-align:left}
.title-btn .ic{color:var(--mute)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.seg button{height:36px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--mute);text-align:center}
.seg button.on{background:var(--club-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--club)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px;padding-inline:var(--gl) var(--gr);background:var(--s1);border-block:1px solid var(--line);margin-top:14px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);text-align:center}
.day b{font-family:var(--f-display);font-size:16px;color:var(--fg)}
.day small{font-size:11px;font-weight:700}
.day.on{background:var(--club);color:var(--club-ink)}
.day.on b{color:var(--club-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:12px;padding-inline:var(--gl) var(--gr)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.cls{display:flex;gap:12px;align-items:center;width:100%;padding-block:14px;border-bottom:1px solid var(--line);text-align:left}
.cls .t{flex:none;width:52px}
.cls .t b{display:block;font-family:var(--f-display);font-size:14px;font-weight:600}
.cls .t small{font-size:11.5px;color:var(--dim)}
.cls .ini{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--club-soft);color:var(--fg)}
.cls .nm{font-weight:800;font-size:15px;line-height:1.25}
.cls .sub{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls .fill{flex:none;width:54px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cls .fill small{font-size:11.5px;color:var(--mute);font-weight:700}
.meter{width:100%;height:5px;border-radius:3px;background:var(--s3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--club);border-radius:3px}
.meter.full i{background:var(--bad)}
.cls.past{opacity:.42}
.cls .mine{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--ok)}
.cls .mine .ic{width:14px;height:14px}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:48px 24px;color:var(--mute)}
.empty .ic{width:44px;height:44px;color:var(--s3)}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:17px}

/* trainers */
.tr{display:flex;gap:14px;align-items:center;width:100%;padding-block:14px;border-bottom:1px solid var(--line);text-align:left}
.tr .ph{width:64px;height:64px;border-radius:18px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#fff;position:relative}
.tr .ph .vf{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--magenta);display:grid;place-items:center;box-shadow:0 0 0 2px var(--ink)}
.tr .ph .vf .ic{width:12px;height:12px;color:#fff}
.tr .role{font-size:11.5px;color:var(--mute);font-weight:700}
.tr .nm{font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.2}
.tr .price{font-size:13px;font-weight:700}

/* profile */
.me-hd{display:flex;align-items:center;gap:16px;padding-top:20px}
.me-hd h1{font-size:24px}
.bigav{width:84px;height:84px;border-radius:50%;background:var(--club);color:var(--club-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;flex:none}
.ptsline{margin-top:6px;display:flex;align-items:baseline;gap:8px}
.ptsline b{font-family:var(--f-display);font-size:22px}
.contract{position:relative;overflow:hidden;border-radius:24px;padding:18px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;isolation:isolate}
.contract .cname{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1}
.contract .glow{position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--club);opacity:.18;z-index:-1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--s2);border-radius:14px;padding:10px}
.kv b{display:block;font-family:var(--f-display);font-size:17px}
.kv small{font-size:11.5px;color:var(--mute);line-height:1.2;display:block}
.list{display:flex;flex-direction:column}
.list-title{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--mute);margin-top:30px;margin-bottom:6px}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;text-align:left}
.li .ic{color:var(--mute)}
.li .chev{color:var(--dim);width:18px;height:18px}
.li .val{color:var(--mute);font-size:13px;font-weight:600}
.badge-n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--magenta);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center}
.demo-note{margin-top:24px;padding:14px;border-radius:16px;background:var(--s1);border:1px dashed var(--s3);font-size:12.5px;color:var(--mute)}

/* layers: pages + sheets */
#layer{position:absolute;inset:0;z-index:30;pointer-events:none}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:auto}
.layer.page{background:var(--ink);animation:pin .26s cubic-bezier(.2,.8,.2,1)}
.layer.page.out{animation:pout .2s ease-in forwards}
@keyframes pin{from{transform:translateX(100%)}to{transform:none}}
@keyframes pout{to{transform:translateX(100%)}}
.layer.sheet{justify-content:flex-end}
.layer.sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fin .2s}
.layer.sheet .panel{position:relative;max-height:90%;display:flex;flex-direction:column;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--line);animation:sin .28s cubic-bezier(.2,.8,.2,1)}
.layer.sheet.out .panel{animation:sout .2s ease-in forwards}
.layer.sheet.out .backdrop{animation:fout .2s forwards}
@keyframes sin{from{transform:translateY(100%)}to{transform:none}}
@keyframes sout{to{transform:translateY(100%)}}
@keyframes fin{from{opacity:0}}
@keyframes fout{to{opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--s3);margin:10px auto 0;flex:none}
.ph-head{display:grid;grid-template-columns:minmax(40px,auto) 1fr minmax(40px,auto);align-items:center;gap:8px;padding-block:10px;flex:none}
.ph-head h2{font-size:16px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-head .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.ph-head .ib:hover{background:var(--s2)}
.skip{height:40px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:700;color:var(--mute)}
.skip:hover{color:var(--fg);background:var(--s2)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:28px}
.footer{flex:none;padding-top:12px;padding-bottom:16px;background:var(--ink);border-top:1px solid var(--line)}
.sheet .footer{background:var(--s1)}
.progress-top{height:3px;border-radius:2px;background:var(--s3);overflow:hidden;margin:0 auto;width:120px}
.progress-top i{display:block;height:100%;background:var(--club);transition:width .3s}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mute);font-weight:700}
.input{height:52px;border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:0 14px;font-size:16px;font-weight:600;width:100%;color:var(--fg);transition:border-color .15s}
.input:focus{outline:none;border-color:var(--club)}
.input::placeholder{color:var(--dim)}
textarea.input{height:120px;padding:12px 14px;resize:none;line-height:1.4}
.input.code{height:64px;text-align:center;font-family:var(--f-display);font-size:28px;letter-spacing:.5em;padding-left:.5em}
.err{font-size:12.5px;color:var(--bad);font-weight:600;min-height:1em}
.hint{font-size:12.5px;color:var(--mute)}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:var(--s3);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch.on{background:var(--club)}
.switch.on::after{transform:translateX(20px)}

/* onboarding */
.ob-splash{flex:1;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;isolation:isolate;padding-top:28px;padding-bottom:24px}
.ob-splash .ring{position:absolute;border-radius:50%;z-index:-1}
.ob-splash h1{margin:0}
.clubcard{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--s1);border:1.5px solid var(--line);text-align:left;width:100%;transition:border-color .15s,background .15s}
.clubcard.on{border-color:var(--club);background:var(--club-soft)}
.clubcard .mark-kp{height:26px}
.clubcard .feats{display:flex;flex-wrap:wrap;gap:6px}
.clubcard .feats span{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--s2);color:var(--mute)}
.clubcard[data-id="os"]{--club:var(--wine-hi);--club-soft:rgba(168,68,58,.18)}
.tag-soon{font-size:11px;font-weight:800;color:var(--sand);background:rgba(199,188,177,.12);padding:3px 8px;border-radius:999px;white-space:nowrap}

/* contract carousel */
.cc-track{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:12px 18px;padding-inline:calc(50% - 128px)}
.cc-track::-webkit-scrollbar{display:none}
.cc{flex:0 0 256px;min-height:178px;scroll-snap-align:center;border-radius:20px;padding:16px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;text-align:left;opacity:.55;transform:scale(.95);transition:opacity .2s,transform .2s,border-color .2s,background .2s;position:relative}
.cc.on{opacity:1;transform:none;border-color:var(--club);background:linear-gradient(180deg,var(--club-soft),var(--s1) 70%)}
.cc .cc-badge{align-self:flex-start;font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;background:var(--magenta);color:#fff}
.cc h3{font-size:19px;line-height:1.12}
.cc .cc-sub{font-size:12.5px;color:var(--mute);flex:1}
.cc .cc-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cc .cc-price b{font-family:var(--f-display);font-size:22px}
.cc .cc-price s{font-size:13px;color:var(--dim)}
.cc .disc{font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--magenta);color:#fff}
.feat{display:flex;align-items:flex-start;gap:12px;padding-block:13px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.feat .ok{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--club);color:var(--club-ink);display:grid;place-items:center;flex:none}
.feat .ok .ic{width:14px;height:14px}
.paybar{display:flex;align-items:center;gap:12px}
.paybar .grow b{display:block;font-family:var(--f-display);font-size:18px}
.paybar .grow small{color:var(--mute);font-size:12.5px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);font-size:14.5px}
.sumrow span:first-child{color:var(--mute)}
.sumrow b{text-align:right}

/* QR */
.qrbox{background:var(--qr-bg);border-radius:24px;padding:18px;width:min(280px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--qr-ink)}
.qr{width:100%;height:auto;display:block}
.qr-fallback{font-family:var(--f-display);font-size:18px;padding:30px 0;word-break:break-all;text-align:center}
.timer{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#5A524C}
.timer svg{width:18px;height:18px;transform:rotate(-90deg)}

/* shop */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--s1);border:1px solid var(--line);text-align:left}
.art{aspect-ratio:1/0.82;display:grid;place-items:center;position:relative;overflow:hidden;isolation:isolate;max-width:100%}
.art .ic{width:44px;height:44px;stroke-width:1.5}
.art::after{content:"";position:absolute;width:120%;aspect-ratio:1;border-radius:50%;border:1.5px solid currentColor;opacity:.18;z-index:-1;right:-55%;bottom:-60%}
.prod .info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .info b{font-size:13.5px;line-height:1.25}
.prod .info small{font-size:12px;color:var(--mute)}
.prod .info .pr{margin-top:auto;padding-top:6px;font-size:13px;font-weight:800}
.prod .info .pr span{color:var(--dim);font-weight:600;font-size:11.5px}
.tone-blue{background:var(--blue);color:#fff}
.tone-magenta{background:var(--magenta);color:#fff}
.tone-wine{background:var(--wine);color:#F6ECE2}
.tone-sand{background:var(--sand);color:#2A1F1A}
.tone-ink{background:var(--s3);color:var(--fg)}
.spots{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;padding:4px 7px;border-radius:6px;background:var(--ink);color:var(--fg);text-transform:uppercase;letter-spacing:.04em}
.stepper{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:999px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.stepper b{min-width:28px;text-align:center;font-family:var(--f-display)}

/* locker */
.cells{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--s2);font-size:12.5px;font-weight:800;display:grid;place-items:center;border:1.5px solid transparent;max-width:100%}
.cell.busy{background:transparent;border-color:var(--s2);color:var(--dim);text-decoration:line-through}
.cell.on{background:var(--club);color:var(--club-ink)}
.locker-big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-block:12px}
.msg{max-width:82%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.4}
.msg.club{background:var(--s2);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--blue);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
.composer{display:flex;gap:8px;align-items:center}
.composer .input{height:46px;border-radius:999px}
.composer .send{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}

/* FAQ */
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary .ic{transition:transform .2s;color:var(--mute)}
details[open] summary .ic{transform:rotate(180deg)}
details p{padding-bottom:16px;color:var(--mute);font-size:14px}

.stars{display:flex;gap:6px;justify-content:center}
.stars button{color:var(--s3)}
.stars button .ic{width:38px;height:38px}
.stars button.on{color:var(--warn)}
.stars button.on .ic{fill:currentColor}

.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:var(--fg);color:var(--ink);font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fin .2s;text-align:center}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.success{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#06210F;display:grid;place-items:center;margin:0 auto}
.success .ic{width:40px;height:40px;stroke-width:2.4}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>

</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script>
/* =========================================================
   Команда Первых — веб-версия клиентского приложения сети.
   Все данные ниже — демо. В рабочей версии этот слой
   (объект API) заменяется вызовами REST API вашей CRM (Django/DRF).

function makeContract(def, clubId){
  const start = new Date(T0);
  let end = new Date(T0);
  if (def.term.days) end = addDays(T0, def.term.days);
  if (def.term.months) end = addMonths(T0, def.term.months);
  return { id:def.id, club:clubId, name:def.name, kind:def.kind || 'paid', start:iso(start), end:iso(end), freezeTotal:def.freeze || 0, freezeLeft:def.freeze || 0, freeze:null, guestLeft:def.guests || 0, ptLeft:def.pt || 0, guestActive:false };
}
function cstate(){
  const c = S.contract;
  if (!c) return S.lead ? { k:'lead' } : { k:'none' };
  if (c.kind === 'guest') return { k:'guest' };
  const left = daysBetween(T0, parse(c.end));
  if (c.freeze && parse(c.freeze.from) <= T0 && T0 <= parse(c.freeze.to)) return { k:'frozen', left };
  if (left < 0) return { k:'expired', left };
  return { k: left <= 14 ? 'ending' : 'active', left };
}

function dayClasses(clubId, off){
  const d = addDays(T0, off), key = iso(d), r = rng(clubId + key);
  const slots = [...SLOTS];
  for (let i = slots.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
  const n = 7 + Math.floor(r() * 3);
  const cat = CLASSES[clubId];
  return slots.slice(0, n).sort().map(t => {
    const c = cat[Math.floor(r() * cat.length)];
    const tid = c.tr[Math.floor(r() * c.tr.length)];
    const id = `${clubId}|${key}|${t}`;
    const mine = S.bookings.some(b => b.id === id);
    const base = Math.floor(c.cap * (.3 + r() * .72));
    const booked = Math.min(c.cap, base + (mine ? 1 : 0));
    const past = off === 0 && toMin(t) < nowMin();
    return { ...c, id, key, date:d, off, t, end:fromMin(toMin(t) + c.dur), tid, trainer:TR[tid], booked, mine, past, clubId };
  });
}
function findClass(id){ const [cid, key] = id.split('|'); const off = daysBetween(T0, parse(key)); return dayClasses(cid, off).find(c => c.id === id); }
function clubLoad(id){
  const c = CLUBS[id], h = new Date().getHours(), r = rng(id + iso(T0) + h);
  const open = h >= c.open && h < c.close;
  const now = open ? Math.round(LOAD_CURVE[h] * c.cap * (.9 + r() * .2)) : 0;
  const ratio = now / c.cap;
  return { open, now, lvl: !open ? 'closed' : ratio < .3 ? 'ok' : ratio < .6 ? 'warn' : 'bad' };
}
function trainerSlots(tid){
  const out = [];
  for (let off = 0; off < 4; off++){
    const d = addDays(T0, off), r = rng(tid + iso(d)); const s = [];
    for (let h = 8; h <= 21; h++){ if (r() < .38 && !(off === 0 && h * 60 <= nowMin() + 30)) s.push(`${String(h).padStart(2,'0')}:00`); }
    out.push({ d, off, s:s.filter(t => !S.bookings.some(b => b.type === 'pt' && b.tid === tid && b.key === iso(d) && b.t === t)) });
  }
  return out;
}

function loadCard(id, L){

function mountHero(){
  const sc = $('#slides'), dots = $('#dots'); if (!sc) return;
  const n = sc.children.length;
  const idx = () => Math.round(sc.scrollLeft / (sc.clientWidth || 1));
  sc.addEventListener('scroll', () => { const i = idx(); [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i)); }, { passive:true });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
    let hold = false; sc.addEventListener('pointerdown', () => hold = true); sc.addEventListener('pointerup', () => setTimeout(() => hold = false, 4000));
    TIMERS.push(setInterval(() => { if (hold || STACK.length) return; const i = (idx() + 1) % n; sc.scrollTo({ left:i * sc.children[0].getBoundingClientRect().width + i * 10, behavior:'smooth' }); }, 5500));
  }
}

function openQR(){

    open('sheet', `${sheetHead('Вход в клуб')}<div class="scroll g"><div class="empty">${ic('qr')}<b>QR недоступен</b><span>${msg}</span></div></div><div class="footer g">${st.k === 'frozen' ? '<button class="btn block" data-act="freeze">Управлять заморозкой</button>' : st.k === 'lead' ? '<button class="btn block" data-act="chat">Написать менеджеру</button>' : st.k === 'guest' ? '<button class="btn block ghost" data-act="close">Понятно</button>' : '<button class="btn block" data-act="renew">Выбрать абонемент</button>'}</div>`);
    return;
  }
  const PERIOD = 30;
  const html = `${sheetHead('Вход в клуб')}
    <div class="scroll g" style="display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center">
      <div class="qrbox"><div id="qrSlot" style="width:100%"></div>
        <div class="timer"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#E4DDD6" stroke-width="3"/><circle id="qrRing" cx="10" cy="10" r="8" fill="none" stroke="#2F5BFF" stroke-width="3" stroke-dasharray="50.27" stroke-dashoffset="0" stroke-linecap="round"/></svg><span>Код обновится через <b id="qrSec">30</b> с</span></div>
      </div>
      <div><b style="font-size:17px">${esc(u.first)} ${esc(u.last || '')}</b><div class="small mute">${esc(S.contract.name)} · клиент ${esc(u.id)}</div></div>
      <p class="hint" style="max-width:30ch">Поднесите экран к сканеру турникета. Яркость экрана лучше увеличить.</p>
    </div>`;
  open('sheet', html, el => {
    const draw = () => {
      const slot = Math.floor(Date.now() / (PERIOD * 1000));
      $('#qrSlot', el).innerHTML = qrSVG(`KP1:${u.id.replace(/\D/g,'')}:${slot}`);
    };
    const tick = () => {
      const left = PERIOD - Math.floor(Date.now() / 1000) % PERIOD;
      $('#qrSec', el).textContent = left;
      $('#qrRing', el).setAttribute('stroke-dashoffset', String(50.27 * (1 - left / PERIOD)));
      if (left === PERIOD) draw();
    };
    draw(); tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  });
}
function qrSVG(text){
  if (!window.qrcode) return `<div class="qr-fallback">${esc(text)}</div>`;
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let p = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) p += `M${c},${r}h1v1h-1z`;
  return `<svg class="qr" viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" role="img" aria-label="QR-код для входа"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#FFFFFF"/><path d="${p}" fill="#100E0D"/></svg>`;
}

function mountPicker(el, list, start, onSel){
  const sc = $('#cct', el), cards = [...sc.children];
  const setOn = k => { cards.forEach((c, j) => c.classList.toggle('on', j === k)); $('#ccf', el).innerHTML = list[k].feats.map(f => `<div class="feat"><span>${esc(f)}</span><span class="ok">${ic('check')}</span></div>`).join(''); onSel(k); };
  let cur = -1;
  const pick = () => { const mid = sc.scrollLeft + sc.clientWidth / 2; let best = 0, bd = 1e9; cards.forEach((c, j) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd){ bd = d; best = j; } }); if (best !== cur){ cur = best; setOn(best); } };
  let raf; sc.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(pick); }, { passive:true });
  sc.addEventListener('click', e => { const b = e.target.closest('.cc'); if (b){ const c = cards[+b.dataset.k]; sc.scrollTo({ left:c.offsetLeft - (sc.clientWidth - c.offsetWidth) / 2, behavior:'smooth' }); } });
  requestAnimationFrame(() => { const c = cards[start]; sc.scrollLeft = c.offsetLeft - (sc.clientWidth - c.offsetWidth) / 2; cur = start; setOn(start); });
}

    <div class="sumrow"><span>Клиент</span><b>${esc(O.f.name)}<br><span class="small mute num">${esc(O.f.phone)}</span></b></div>

    </div><div class="footer g stack">${lead ? '<button class="btn block" data-act="obFinish">Отправить заявку</button>' : c.price === 0 ? '<button class="btn block" data-act="obFinish">Записаться на визит</button>' : `<button class="btn block" data-act="obFinish" data-pay="1">${ic('card')} Оплатить ${rub(c.price)}</button><button class="btn block ghost" data-act="obFinish" data-pay="1">Через СБП</button>`}</div>`;
}
const phoneOk = p => p.replace(/\D/g,'').length >= 11;
function obReadInputs(){
  const v = id => { const e = $('#' + id); return e ? e.value.trim() : null; };
  if (v('f-name') !== null) O.f.name = v('f-name');
  if (v('f-dob') !== null) O.f.dob = v('f-dob');
  if (v('f-promo') !== null) O.f.promo = v('f-promo');
  if (v('f-email') !== null) O.f.email = v('f-email');
  if (v('f-phone') !== null) O.f.phone = v('f-phone');
}
function obErr(t){ const e = $('#f-err'); if (e) e.textContent = t; }
function obFinish(){
  const parts = O.f.name.split(/\s+/);
  S = fresh();
  S.user = { first:parts[0] || 'Гость', last:parts.slice(1).join(' '), phone:O.f.phone, email:O.f.email, gender:O.f.g, dob:O.f.dob, id:'C-' + (100000 + Math.floor(Math.random() * 89999)) };
  S.clubId = O.club;
  const def = CONTRACTS[O.club][O.ci];
  if (def.price === null) { S.lead = { club:O.club, id:def.id, name:def.name }; notify('Заявка отправлена', `${def.name}: менеджер свяжется с вами`); }
  else { S.contract = makeContract(def, O.club); notify('Абонемент оформлен', `${def.name}, ${CLUBS[O.club].name}`); }
  addPoints(500, 'Приветственные баллы');
  S.purchases.push({ id:'#' + (187000 + Math.floor(Math.random() * 999)), pid:'p3', n:'Вода', sub:'0,5 л', d:iso(new Date()), used:false, gift:true, club:O.club });
  notify('Добро пожаловать в «Команду Первых»', 'Начислили 500 приветственных баллов и подарок — воду в фитнес-баре');
  save(); O = { ...O, step:'splash', sent:false }; renderMain();
}
function demoLogin(){
  S = fresh();
  const digits = O.f.phone.replace(/\D/g,'');
  S.user = { first:'Никита', last:'', phone:O.f.phone, email:'', gender:'m', id:'C-1' + digits.slice(-5).padStart(5,'0') };
  S.clubId = 'kp';
  const c = makeContract(contractDef('kp-prem'), 'kp'); c.start = iso(addDays(T0, -356)); c.end = iso(addDays(T0, 9)); c.freezeLeft = 62; c.guestLeft = 47; c.ptLeft = 1;
  S.contract = c;
  S.points = 0; addPoints(500, 'Баллы за год в клубе');
  S.joined = { steps:{ p:.38 }, visits:{ p:.5 } };
  S.purchases.push({ id:'#187431', pid:'p3', n:'Вода', sub:'0,5 л', d:iso(new Date()), used:false, gift:true, club:'kp' });
  const tomorrow = dayClasses('kp', 1)[2]; if (tomorrow) S.bookings.push({ id:tomorrow.id, type:'cls', key:tomorrow.key, t:tomorrow.t, name:tomorrow.n, sub:`${tomorrow.trainer.name} · ${tomorrow.room}`, club:'kp' });
  notify('Абонемент заканчивается через 9 дней', 'Продлите «Премиум» сейчас — сохраним текущую цену');
  notify('Акция до 31.10', '100 визитов за 3 334 ₽ в месяц');
  notify('День открытых дверей в Ховрино', '23–26 октября вход в «Образ Силы» бесплатный');
  save(); renderMain();
}

// ---------- actions ----------
const AUTH_ACTS = ['qr','book','waitlist','renew','locker','freeze','invite','purchases','chat','review','payMethod','deleteAcc','chJoin','myBookings','notifs','points'];
const ACT = {
  close: () => close(),
  tab: d => { S.tab = d.k; save(); renderMain(); $('#view').scrollTop = 0; },
  goSched: d => { S.tab = 'sched'; UI.schedMode = 'all'; UI.cat = d.cat || 'all'; UI.day = 0; save(); renderMain(); },
  pickClub: () => openPickClub(),
  setClub: d => { S.clubId = d.id; UI.cat = 'all'; UI.dept = 'all'; save(); close(true); renderMain(); toast(`Ваш клуб: ${CLUBS[d.id].name}, ${CLUBS[d.id].short}`); },
  notifs: () => openNotifs(),
  qr: () => openQR(),
  shop: () => { close(true); openShop('shop'); },
  mini: () => openShop('mini'),
  locker: () => openLocker(),
  lockFree: () => { S.locker = null; save(); close(); toast('Шкафчик освобождён'); },
  freeze: () => { close(true); openFreeze(); },
  unfreeze: () => { const c = S.contract; const f = c.freeze; const started = parse(f.from) <= T0; const used = started ? daysBetween(parse(f.from), T0) : 0; const back = f.days - used; c.freezeLeft += back; c.end = iso(addDays(parse(c.end), -back)); c.freeze = null; save(); close(); toast(started ? 'Абонемент разморожен' : 'Заморозка отменена'); refresh(); },
  invite: () => openInvite(),
  giftClose: () => { S.giftClosed = true; save(); renderTab(); },
  purchases: () => { close(true); openPurchases(); },
  redeem: d => openRedeem(d.id),
  contacts: d => openContacts(d.id),
  chat: () => { close(true); openChat(); },
  day: d => { UI.day = +d.i; renderTab(); },
  cat: d => { UI.cat = d.k; renderTab(); },
  dept: d => { UI.dept = d.k; renderTab(); },
  schedMode: d => { UI.schedMode = d.k; renderTab(); },
  cls: d => openClass(d.id),
  book: d => { const x = findClass(d.id); if (!x) return; S.bookings.push({ id:x.id, type:'cls', key:x.key, t:x.t, name:x.n, sub:`${x.trainer.name} · ${x.room}`, club:x.clubId }); notify('Вы записаны', `${x.n}, ${dfmt(x.date)} в ${x.t}`); save(); close(); toast(`Записали: ${x.n}, ${x.t}`); refresh(); },
  unbook: d => { S.bookings = S.bookings.filter(b => b.id !== d.id); save(); close(); toast('Запись отменена'); refresh(); },
  waitlist: d => { close(); toast('Вы в листе ожидания — сообщим, если место освободится'); },
  ptInfo: d => { const b = S.bookings.find(x => x.id === d.id); if (!b) return; open('sheet', `${sheetHead('Персональная тренировка')}<div class="scroll g"><h3 class="h3">${esc(TR[b.tid].name)}</h3><div class="sumrow"><span>Когда</span><b>${dfmt(parse(b.key))}, ${b.t}</b></div><div class="sumrow"><span>Клуб</span><b>${esc(CLUBS[b.club].name)}</b></div></div><div class="footer g"><button class="btn block danger" data-act="unbookPt" data-id="${esc(b.id)}">Отменить тренировку</button></div>`); },
  unbookPt: d => { S.bookings = S.bookings.filter(b => b.id !== d.id); if (S.contract && S.contract.ptLeft < (contractDef(S.contract.id)?.pt || 0)) S.contract.ptLeft += 1; save(); close(); toast('Тренировка отменена'); refresh(); },
  trainer: d => { close(true); openTrainer(d.id); },
  chJoin: d => { S.joined[d.id] = { p:0 }; notify('Вы в челлендже', CHALLENGES.find(c => c.id === d.id).title); save(); renderTab(); toast('Вы участвуете! Прогресс обновляется после визитов'); },
  chLog: d => { const ch = CHALLENGES.find(c => c.id === d.id), j = S.joined[d.id]; j.p = Math.min(1, j.p + 1 / ch.total); if (j.p >= 1 && !j.done){ j.done = true; addPoints(ch.reward, `Челлендж: ${ch.title}`); toast(`Челлендж пройден! +${ch.reward} баллов`); } save(); renderTab(); },
  myBookings: () => { S.tab = 'sched'; UI.schedMode = 'mine'; save(); close(true); renderMain(); },
  points: () => openPoints(),
  faq: () => openFAQ(),
  review: () => openReview(),
  renew: () => { close(true); openContracts(); },
  product: d => openProduct(d.id),
  miniOpen: d => openMini(d.id),
  copy: (d) => { const v = d.v; const ok = () => toast('Скопировано'); try { navigator.clipboard.writeText(v).then(ok, () => toast(v)); } catch (e) { toast(v); } },
  payMethod: () => openSimple('Способ оплаты', `<div class="empty">${ic('card')}<b>Карта не привязана</b><span>Привяжите карту, чтобы ежемесячные платежи по рассрочке списывались автоматически</span></div>`, `<button class="btn block" data-act="payBind">Привязать карту</button>`),
  payBind: () => toast('Привязка карты появится после подключения эквайринга'),
  privacy: () => { open('page', `${pageHead('Уведомления и приватность')}<div class="scroll g">${[['push','Пуш-уведомления','Записи, напоминания о занятиях, абонемент'],['sms','СМС об акциях','Спецпредложения клуба'],['visible','Показывать меня в «Кто в клубе»','Другие клиенты увидят ваш инициал']].map(([k, t, s]) => `<button class="li" data-pref="${k}"><span class="grow">${t}<br><span class="small mute" style="font-weight:500">${s}</span></span><span class="switch ${S.prefs[k] ? 'on' : ''}"></span></button>`).join('')}</div>`, el => { el.addEventListener('click', e => { const b = e.target.closest('[data-pref]'); if (!b) return; const k = b.dataset.pref; S.prefs[k] = !S.prefs[k]; b.querySelector('.switch').classList.toggle('on', S.prefs[k]); save(); }); }); },
  lang: () => openSimple('Язык', `<button class="li">${ic('check')}<span class="grow">Русский</span></button><button class="li" data-act="langEn"><span style="width:22px"></span><span class="grow">English</span><span class="val">скоро</span></button>`),
  langEn: () => toast('Английская версия появится позже'),
  deleteAcc: () => openSimple('Удалить аккаунт', `<p class="mute" style="padding-top:12px">Мы удалим профиль в приложении. Договор и абонемент в клубе останутся действующими — их закрывает менеджер по заявлению.</p>`, `<button class="btn block danger" data-act="deleteGo">Отправить запрос на удаление</button>`),
  deleteGo: () => { close(); toast('Запрос отправлен. Менеджер свяжется в течение 3 дней'); },
  reset: () => { try { localStorage.removeItem(KEY); } catch (e) {} S = fresh(); O = { step:'splash', club:'kp', ci:0, f:{ g:'m', name:'', dob:'', promo:'', email:'', phone:'' }, mode:'new', sent:false }; close(true); renderOnb(); },
  logout: () => ACT.reset(),
  // onboarding
  install: () => openInstall(),
  obSkip: () => { S = fresh(); S.user = { first:'Гость', last:'', guest:true, id:'—', gender:'m', phone:'' }; S.clubId = O.club; S.tab = 'home'; save(); O.step = 'splash'; O.sent = false; renderMain(); },
  authNew: () => { const c = S.clubId; S = fresh(); S.clubId = c; save(); close(true); O = { ...O, club:c, mode:'new', step:'club', sent:false }; O.ci = Math.max(0, CONTRACTS[c].findIndex(x => x.badge === 'Рекомендуем')); renderOnb(); },
  authLogin: () => { const c = S.clubId; S = fresh(); S.clubId = c; save(); close(true); O = { ...O, club:c, mode:'login', step:'contact', sent:false }; renderOnb(); },
  obNew: () => { O.mode = 'new'; O.step = 'club'; O.ci = Math.max(0, CONTRACTS[O.club].findIndex(c => c.badge === 'Рекомендуем')); renderOnb(); },
  obLogin: () => { O.mode = 'login'; O.step = 'contact'; renderOnb(); },
  obClose: () => { O.step = 'splash'; O.sent = false; renderOnb(); },
  obBack: () => {
    obReadInputs();
    if (O.mode === 'login'){ if (O.step === 'code' && O.sent){ O.sent = false; } else if (O.step === 'code') O.step = 'contact'; else O.step = 'splash'; return renderOnb(); }
    if (O.step === 'code' && O.sent){ O.sent = false; return renderOnb(); }
    const i = OB_STEPS.indexOf(O.step); O.step = i <= 0 ? 'splash' : OB_STEPS[i - 1]; renderOnb();
  },
  obClub: d => { O.club = d.id; O.ci = Math.max(0, CONTRACTS[d.id].findIndex(c => c.badge === 'Рекомендуем')); document.documentElement.dataset.club = d.id; document.querySelectorAll('.clubcard').forEach(b => b.classList.toggle('on', b.dataset.id === d.id)); },
  obG: d => { O.f.g = d.g; document.querySelectorAll('[data-act="obG"]').forEach(b => b.classList.toggle('on', b.dataset.g === d.g)); },
  obNext: () => {
    obReadInputs();
    if (O.step === 'club'){ O.step = 'contract'; return renderOnb(); }
    if (O.step === 'contract'){ O.step = 'data'; return renderOnb(); }
    if (O.step === 'data'){ if (O.f.name.split(/\s+/).filter(Boolean).length < 2) return obErr('Укажите имя и фамилию — как в паспорте'); if (!O.f.dob) return obErr('Укажите дату рождения'); O.step = 'contact'; return renderOnb(); }
    if (O.step === 'contact'){ if (O.mode !== 'login' && O.f.email && !/^\S+@\S+\.\S+$/.test(O.f.email)) return obErr('Проверьте email — в нём должна быть «@» и домен'); if (!phoneOk(O.f.phone)) return obErr('Введите номер полностью: +7 и 10 цифр'); O.step = 'code'; O.sent = false; return renderOnb(); }
  },
  obSend: () => { O.sent = true; renderOnb(); },
  obResend: () => { toast('Код отправлен повторно'); clearTimers(); const b = $('#resend'); if (b){ b.disabled = true; } startResend(); },
  obVerify: () => { const v = ($('#f-code')?.value || '').replace(/\D/g,''); if (v.length !== 4) return obErr('Введите 4 цифры из СМС'); if (O.mode === 'login') return demoLogin(); O.step = 'pay'; O.sent = false; renderOnb(); },
  obFinish: (d, el) => { if (d.pay){ document.querySelectorAll('[data-act="obFinish"]').forEach(b => b.disabled = true); el.innerHTML = '<span class="spin"></span>'; setTimeout(obFinish, 900); } else obFinish(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (AUTH_ACTS.includes(t.dataset.act) && needAuth()) return;
  fn(t.dataset, t, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && STACK.length) close(); });
document.addEventListener('input', e => { if (e.target.id === 'f-phone'){ let d = e.target.value.replace(/\D/g,''); if (d.startsWith('8')) d = '7' + d.slice(1); if (d && !d.startsWith('7')) d = '7' + d; d = d.slice(0, 11); const p = d.slice(1); let s = '+7'; if (p.length) s += ' ' + p.slice(0,3); if (p.length > 3) s += ' ' + p.slice(3,6); if (p.length > 6) s += '-' + p.slice(6,8); if (p.length > 8) s += '-' + p.slice(8,10); e.target.value = d ? s : ''; } if (e.target.id === 'f-code' && e.target.value.replace(/\D/g,'').length === 4) setTimeout(() => ACT.obVerify(), 150); });

// boot
if (S.user) renderMain(); else renderOnb();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
